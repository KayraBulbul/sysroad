- name: char int char double
  args: ["char", "int", "char", "double"]
  stdout: "offset  size  field\n     0     1  char\n     1        (3 bytes padding)\n     4     4  int\n     8     1  char\n     9        (7 bytes padding)\n    16     8  double\nsizeof 24, alignof 8, 10 bytes of padding\n"
- name: tail padding
  args: ["double", "char"]
  stdout: "offset  size  field\n     0     8  double\n     8     1  char\n     9        (7 bytes padding)\nsizeof 16, alignof 8, 7 bytes of padding\n"
  hidden: true
- name: an array field
  args: ["char", "int16[3]", "char"]
  stdout: "offset  size  field\n     0     1  char\n     1        (1 byte padding)\n     2     6  int16[3]\n     8     1  char\n     9        (1 byte padding)\nsizeof 10, alignof 2, 2 bytes of padding\n"
  hidden: true
