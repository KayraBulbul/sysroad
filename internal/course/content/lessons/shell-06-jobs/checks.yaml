- name: background jobs still work without a terminal
  stdin: "sleep 1 &\njobs\nwait\necho done\n"
  stdout: "[1] Running  sleep 1\ndone\n"
- name: Done is still reported
  stdin: "true &\nsleep 0.6\necho next\n"
  stdout: "[1] Done  true\nnext\n"
  hidden: true
- name: a background job still can't read a script's input
  stdin: "cat &\nsleep 0.6\necho still mine\n"
  stdout: "[1] Done  cat\nstill mine\n"
  hidden: true
