- name: runs a command
  stdin: "echo hello world\n"
  stdout: "hello world\n"
- name: extra spaces and tabs, and blank lines
  stdin: "   echo \t spaced    out  \n\n\t\nprintf %s/ a b c\n"
  stdout: "spaced out\na/b/c/"
- name: comments
  stdin: "echo one # not this\n# nor this line\necho two#three\n"
  stdout: "one\ntwo#three\n"
- name: a command that isn't found, and the shell carries on
  stdin: "no-such-command-anywhere\necho after\n"
  stdout: "after\n"
- name: the shell exits with the last command's status
  stdin: "echo a\nfalse\n"
  stdout: "a\n"
  exit: 1
- name: 127 for a command that isn't found
  stdin: "no-such-command-anywhere\n"
  stdout: ""
  exit: 127
  hidden: true
- name: commands read the rest of the shell's input
  stdin: "head -n 1\nthis line goes to head\necho back in the shell\n"
  stdout: "this line goes to head\nback in the shell\n"
  hidden: true
- name: a last line with no newline
  stdin: "echo first\necho last"
  stdout: "first\nlast\n"
  hidden: true
- name: no input at all
  stdin: ""
  stdout: ""
  hidden: true
