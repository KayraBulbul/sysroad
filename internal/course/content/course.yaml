title: Systems Programming in C++
phases:
  - id: p0
    title: Setup
    summary: A working C++20 toolchain on both machines and the lesson workflow.
    chapters:
      - id: setup-workflow
        title: Toolchain & workflow
        summary: |-
          Check your compiler, sanitizers and debugger, then learn the loop every
          lesson uses: read the brief, write code, Run, Submit.
        lessons:
          - id: setup-toolchain
            title: Check your toolchain
          - id: setup-lessons
            title: How a lesson works
          - id: setup-debugger
            title: Debugger drills (gdb / lldb)
          - id: setup-sanitizers
            title: Sanitizers catch five bugs

  - id: p1
    title: C++ for a Go/Python brain
    summary: |-
      The everyday C++ you'll write for the rest of the course, learned by
      building your own coreutils: echo, wc, cat, hexdump and grep.
    chapters:
      - id: cpp-coreutils-wc
        title: "Coreutils I: echo & wc"
        summary: main and argv, std::string, std::string_view, std::vector, reading input.
        project: echo, then wc built up lesson by lesson
        lessons:
          - id: cpp-01-echo
            title: echo
          - id: cpp-02-words
            title: Counting words
          - id: cpp-03-counts
            title: Lines, words and bytes from a stream
          - id: cpp-04-wc-flags
            title: "wc flags: -l, -w, -c"
          - id: cpp-05-wc-files
            title: Files, totals and errors
          - id: cpp-06-wc-quiz
            title: "Check: strings and views"
            kind: quiz
          - id: cpp-07-wc-format
            title: GNU-exact column widths
      - id: cpp-coreutils-cat
        title: "Coreutils II: cat"
        summary: Files and streams, binary-safe I/O, flags that rewrite output.
        project: cat with every GNU flag
        lessons:
          - id: cpp-08-cat
            title: cat one file, then many
          - id: cpp-09-cat-binary
            title: Binary-safe copying
          - id: cpp-10-cat-number
            title: "-n and -b: numbering lines"
          - id: cpp-11-cat-squeeze
            title: "-s: squeezing blank lines"
          - id: cpp-12-cat-show
            title: "-E, -T, -v, -A: showing the invisible"
          - id: cpp-13-cat-quiz
            title: "Check: streams"
            kind: quiz
      - id: cpp-types
        title: Structs, classes & RAII
        summary: Constructors, member functions, const, references vs pointers, destructors that clean up.
        project: hexdump -C
        lessons:
          - id: cpp-14-structs
            title: Structs and member functions
          - id: cpp-15-refs-pointers
            title: References vs pointers
          - id: cpp-16-const
            title: const everywhere
          - id: cpp-17-raii
            title: RAII — a file descriptor that closes itself
          - id: cpp-18-hexdump
            title: hexdump -C, line by line
          - id: cpp-19-hexdump-skip
            title: "hexdump: -s, -n and squeezing repeats"
          - id: cpp-20-types-quiz
            title: "Check: ownership and lifetimes"
            kind: quiz
      - id: cpp-generic
        title: Errors, lambdas & templates
        summary: std::optional, error values vs exceptions, lambdas, <algorithm>, a first template.
        project: grep
        lessons:
          - id: cpp-21-optional
            title: std::optional and error values
          - id: cpp-22-exceptions
            title: Exceptions, and when not to use them
          - id: cpp-23-lambdas
            title: Lambdas and <algorithm>
          - id: cpp-24-templates
            title: Your first template
          - id: cpp-25-grep
            title: "grep: fixed strings"
          - id: cpp-26-grep-flags
            title: "grep: -i, -v, -n, -c"
          - id: cpp-27-grep-recursive
            title: "grep: -r over a directory tree"
            kind: project

  - id: p2
    title: Memory, for real
    summary: Layout, the stack and the heap, ownership, move semantics, UB — then rebuild String, Vector and HashMap.
    chapters:
      - id: mem-layout
        title: Layout, sizeof & alignment
        lessons:
          - id: mem-01-bytes
            title: Objects are bytes
          - id: mem-02-alignment
            title: Alignment and padding
          - id: mem-03-struct-order
            title: Reordering fields to shrink a struct
          - id: mem-04-endianness
            title: Endianness and reading binary headers
          - id: mem-05-arrays-decay
            title: "Arrays, pointers and decay"
          - id: mem-06-span
            title: "Pointer arithmetic and std::span"
          - id: mem-07-layout-quiz
            title: "Check: layout"
            kind: quiz
          - id: mem-08-bmp
            title: Read a BMP image header by hand
            kind: project
      - id: mem-heap
        title: Stack, heap, new/delete & smart pointers
        lessons:
          - id: mem-09-stack-frames
            title: "The stack, frame by frame"
          - id: mem-10-new-delete
            title: "new, delete and what they cost"
          - id: mem-11-leaks
            title: "Leaks, double frees and how ASan finds them"
          - id: mem-12-unique-ptr
            title: "std::unique_ptr: one owner"
          - id: mem-13-shared-ptr
            title: "std::shared_ptr and weak_ptr"
          - id: mem-14-linked-list
            title: A linked list with unique_ptr
          - id: mem-15-heap-quiz
            title: "Check: who frees this?"
            kind: quiz
      - id: mem-move
        title: Copies, moves & the rule of five
        lessons:
          - id: mem-16-copy
            title: Copy constructors and copy assignment
          - id: mem-17-rvalues
            title: "lvalues, rvalues and std::move"
          - id: mem-18-move
            title: "Move constructors: Fd learns to move"
          - id: mem-19-rule-of-five
            title: "The rules of zero, three and five"
          - id: mem-20-noexcept-move
            title: noexcept moves and vector growth
          - id: mem-21-ub-tour
            title: A tour of undefined behaviour
          - id: mem-22-move-quiz
            title: "Check: copies and moves"
            kind: quiz
      - id: mem-rebuild
        title: "Rebuild: String, Vector, HashMap"
        project: your containers, put to work in wordfreq
        lessons:
          - id: mem-23-string
            title: "String, with the small-string optimisation"
            kind: project
          - id: mem-24-vector
            title: "Vector<T>: growth, placement new, destruction"
            kind: project
          - id: mem-25-vector-iter
            title: Vector iterators and invalidation
          - id: mem-26-hashmap
            title: "HashMap: open addressing"
            kind: project
          - id: mem-27-hashmap-grow
            title: "HashMap: deletion and rehashing"
          - id: mem-28-swap-in
            title: "wordfreq: your containers at work"
            kind: project
          - id: mem-29-bench
            title: Benchmark yours against the standard library

  - id: p3
    title: CMake & the text editor
    summary: Real project builds, then your first capstone.
    chapters:
      - id: cmake
        title: CMake in one sitting
        lessons:
          - id: cmake-01-why
            title: Why build systems exist
          - id: cmake-02-first
            title: A first CMakeLists.txt
          - id: cmake-03-targets
            title: "Targets, libraries and include paths"
          - id: cmake-04-options
            title: "Build types, warnings and sanitizers"
          - id: cmake-05-tests
            title: Tests with CTest
          - id: cmake-06-deps
            title: Dependencies with FetchContent
          - id: cmake-07-coreutils
            title: Your coreutils as one CMake project
            kind: project
          - id: cmake-08-quiz
            title: "Check: CMake"
            kind: quiz
      - id: editor
        title: "Capstone: text editor"
        project: raw-mode terminal, rendering, file I/O, search, syntax highlighting
        lessons:
          - id: editor-01-raw
            title: Raw mode and reading keys
            kind: capstone
          - id: editor-02-screen
            title: Drawing the screen with escape codes
            kind: capstone
          - id: editor-03-cursor
            title: Moving the cursor
            kind: capstone
          - id: editor-04-open
            title: Opening files and scrolling
            kind: capstone
          - id: editor-05-insert
            title: Inserting and deleting text
            kind: capstone
          - id: editor-06-save
            title: "Saving, and the unsaved-changes flag"
            kind: capstone
          - id: editor-07-search
            title: Incremental search
            kind: capstone
          - id: editor-08-highlight
            title: Syntax highlighting for C++
            kind: capstone
          - id: editor-09-undo
            title: Undo and redo
            kind: capstone

  - id: p4
    title: Data & machine code
    summary: Bits, integers, floats, and reading x86-64 and arm64 from clang's output.
    chapters:
      - id: data-bits
        title: Bits, integers & floats
        lessons:
          - id: bits-01-binary
            title: "Binary, hex and bitwise operators"
          - id: bits-02-masks
            title: "Masks, shifts and bit fields"
          - id: bits-03-twos
            title: "Two's complement and overflow"
          - id: bits-04-conversions
            title: Integer promotions and conversions
          - id: bits-05-floats
            title: IEEE 754 floats by hand
          - id: bits-06-float-traps
            title: Floats that surprise you
          - id: bits-07-bitset
            title: A Bitset class
            kind: project
          - id: bits-08-quiz
            title: "Check: bits and numbers"
            kind: quiz
      - id: data-asm
        title: Reading assembly
        lessons:
          - id: asm-01-registers
            title: Registers and your first instructions
          - id: asm-02-reading
            title: "Reading clang's output"
          - id: asm-03-control
            title: Branches and loops
          - id: asm-04-calls
            title: Calling conventions and the stack
          - id: asm-05-data
            title: "Arrays, structs and pointers in assembly"
          - id: asm-06-optimised
            title: What -O2 does to your code
          - id: asm-07-gdb
            title: Stepping through assembly in a debugger
          - id: asm-08-quiz
            title: "Check: assembly"
            kind: quiz
      - id: data-labs
        title: Data, Bomb & Attack Labs
        lessons:
          - id: lab-data
            title: "CS:APP Data Lab"
            kind: lab
          - id: lab-bomb
            title: "CS:APP Bomb Lab"
            kind: lab
          - id: lab-attack
            title: "CS:APP Attack Lab"
            kind: lab

