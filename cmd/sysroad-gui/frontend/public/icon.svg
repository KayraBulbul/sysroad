<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- sysroad: a shell prompt above a road running to the horizon. Vigil colours. -->
  <defs>
    <linearGradient id="sysroad-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25242a"/>
      <stop offset="1" stop-color="#131316"/>
    </linearGradient>
    <linearGradient id="sysroad-road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b292f"/>
      <stop offset="1" stop-color="#3a373f"/>
    </linearGradient>
    <clipPath id="sysroad-tile">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sysroad-bg)"/>
  <g clip-path="url(#sysroad-tile)">
    <path d="M490 560 L534 560 L872 924 L152 924 Z" fill="url(#sysroad-road)"/>
    <g fill="#c65d2e">
      <path d="M506 588 L518 588 L522 628 L502 628 Z"/>
      <path d="M497 676 L527 676 L534 748 L490 748 Z"/>
      <path d="M482 816 L542 816 L553 924 L471 924 Z"/>
    </g>
  </g>
  <path d="M322 282 L442 378 L322 474" fill="none" stroke="#ddd3c9" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="494" y="440" width="196" height="60" rx="30" fill="#c65d2e"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="4"/>
</svg>
